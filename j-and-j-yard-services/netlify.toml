[build]
  command = "npm run build"
  publish = "dist/j-and-j-yard-services/browser"

[build.environment]
  # Angular 22 needs Node 22.22.3+ or 24.15+.
  NODE_VERSION = "24"

# The contact form uses Netlify Forms (see the hidden form in src/index.html).
# Enable form detection under Site configuration > Forms, then add an
# email notification under Forms > Form notifications.

# Prerendered routes: serve each page's own static HTML.
[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact/index.html"
  status = 200

# Everything else falls back to the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
