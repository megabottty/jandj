[build]
  command = "npm run build"
  publish = "dist/j-and-j-yard-services"
  functions = "netlify/functions"

# Note: set SENDGRID_API_KEY, RECIPIENT_EMAIL, FROM_EMAIL in Netlify UI (Site settings > Build & deploy > Environment)

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
